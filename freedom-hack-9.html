<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>linger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('linger-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
<style>

  :root {
    --void: #08080a;
    --surface: #111114;
    --border: #1e1e22;
    --text-ghost: #2a2a2e;
    --cream: #ede8df;
    --cream-dim: rgba(237,232,223,0.6);
    --cream-ghost: rgba(237,232,223,0.15);
    --pink: #7b5ea7;
    --green: #4a7fb5;
    --reading: 'Source Serif 4', Georgia, serif;
    --brand: 'Playfair Display', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
  }

  [data-theme="light"] {
    --void: #f5f2ec;
    --surface: #ebe7e0;
    --border: rgba(42,40,36,0.08);
    --text-ghost: rgba(42,40,36,0.18);
    --cream: #2a2824;
    --cream-dim: rgba(42,40,36,0.55);
    --cream-ghost: rgba(42,40,36,0.15);
    --pink: #6a4e96;
    --green: #3a6fa5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { transition: background-color 0.6s ease; background: var(--void); }
  body {
    background: var(--void);
    color: var(--cream);
    font-family: var(--reading);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    height: 100vh;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    width: 100vw;
    user-select: none;
    cursor: none;
    -webkit-tap-highlight-color: rgba(123,94,167,0.1);
    transition: background-color 0.6s ease, color 0.6s ease;
  }
  body.show-cursor { cursor: default; }

  /* ─── START PAGE (hidden, auto-start) ─── */
  .start-page { display: none; }

  /* ─── AMBIENT ─── */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow-x: hidden;
    pointer-events: none;
  }
  .ambient .orb {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 8s ease, transform 14s ease;
    will-change: opacity, transform;
  }
  .orb--1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--pink), transparent 70%); top: -20%; right: -10%; }
  .orb--2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--green), transparent 70%); bottom: -25%; left: -10%; }
  .orb--3 { width: 350px; height: 350px; background: radial-gradient(circle, #5a4a8a, transparent 70%); top: 40%; left: 20%; }

  /* void — darkness, cold, nothing */
  .mood-void .orb--1 { opacity: 0.04; background: radial-gradient(circle, #2a1a4a, transparent 70%); }
  .mood-void .orb--2 { opacity: 0.03; background: radial-gradient(circle, #1a2a4a, transparent 70%); }
  .mood-void .orb--3 { opacity: 0.02; background: radial-gradient(circle, #2a1a3a, transparent 70%); }

  /* stir — words swirling, beginning of motion */
  .mood-stir .orb--1 { opacity: 0.06; background: radial-gradient(circle, #4a3a7a, transparent 70%); transform: translate(-3px, 3px); }
  .mood-stir .orb--2 { opacity: 0.04; background: radial-gradient(circle, #3a5a8a, transparent 70%); transform: translate(3px, -2px); }
  .mood-stir .orb--3 { opacity: 0.03; background: radial-gradient(circle, #5a4a8a, transparent 70%); }

  /* birth — star formation, collapse, inversion */
  .mood-birth .orb--1 { opacity: 0.08; background: radial-gradient(circle, #5a3a9a, transparent 70%); transform: translate(-5px, 5px) scale(1.03); }
  .mood-birth .orb--2 { opacity: 0.06; background: radial-gradient(circle, #3a5aaa, transparent 70%); transform: translate(5px, -3px); }
  .mood-birth .orb--3 { opacity: 0.04; background: radial-gradient(circle, #7b5ea7, transparent 70%); }

  /* nebula — cosmic mist, shimmer, Chandra/Hubble */
  .mood-nebula .orb--1 { opacity: 0.12; background: radial-gradient(circle, #7b5ea7, transparent 70%); transform: translate(-8px, 5px) scale(1.05); }
  .mood-nebula .orb--2 { opacity: 0.08; background: radial-gradient(circle, #4a7fb5, transparent 70%); transform: translate(5px, -5px) scale(1.03); }
  .mood-nebula .orb--3 { opacity: 0.06; background: radial-gradient(circle, #6a5a9a, transparent 70%); transform: translate(-3px, 3px); }

  /* cluster — stars together, paper chains, party */
  .mood-cluster .orb--1 { opacity: 0.1; background: radial-gradient(circle, #5a4a9a, transparent 70%); transform: translate(-5px, 3px); }
  .mood-cluster .orb--2 { opacity: 0.08; background: radial-gradient(circle, #4a7fb5, transparent 70%); transform: translate(8px, -5px) scale(1.03); }
  .mood-cluster .orb--3 { opacity: 0.06; background: radial-gradient(circle, #7b5ea7, transparent 70%); transform: translate(-3px, 3px); }

  /* wonder — exclamation, imagination, interstellar */
  .mood-wonder .orb--1 { opacity: 0.14; background: radial-gradient(circle, #7b5ea7, transparent 70%); transform: translate(-10px, 8px) scale(1.06); }
  .mood-wonder .orb--2 { opacity: 0.1; background: radial-gradient(circle, #4a8fba, transparent 70%); transform: translate(8px, -5px) scale(1.04); }
  .mood-wonder .orb--3 { opacity: 0.08; background: radial-gradient(circle, #6a5aaa, transparent 70%); transform: translate(-5px, 5px); }

  /* fusion — heat, attraction, love */
  .mood-fusion .orb--1 { opacity: 0.16; background: radial-gradient(circle, #8a5eb7, transparent 70%); transform: translate(-12px, 10px) scale(1.08); }
  .mood-fusion .orb--2 { opacity: 0.1; background: radial-gradient(circle, #5a7fc5, transparent 70%); transform: translate(10px, -8px) scale(1.05); }
  .mood-fusion .orb--3 { opacity: 0.08; background: radial-gradient(circle, #7b5ea7, transparent 70%); transform: translate(-5px, 8px) scale(1.03); }

  /* converge — final, particles cling, lean to light */
  .mood-converge .orb--1 { opacity: 0.06; background: radial-gradient(circle, #5a6aaa, transparent 70%); transform: translate(0, -3px); }
  .mood-converge .orb--2 { opacity: 0.04; background: radial-gradient(circle, #4a5a8a, transparent 70%); }
  .mood-converge .orb--3 { opacity: 0.03; background: radial-gradient(circle, #4a5a9a, transparent 70%); }

  /* ─── STAGE ─── */
  .stage {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 8vw; opacity: 0; transition: opacity 0.4s ease;
  }
  .stage.active { opacity: 1; }
  .fragment-display {
    max-width: 680px; text-align: center; min-height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .frag {
    font-family: var(--reading);
    font-size: clamp(26px, 3.8vw, 42px);
    font-weight: 400; line-height: 1.5; color: var(--cream);
    opacity: 0; transform: translateY(6px);
    transition: opacity 1s ease, transform 1s ease;
    text-wrap: balance;
  }
  .frag.visible { opacity: 1; transform: translateY(0); }
  .frag.first { transition: opacity 1.6s ease, transform 1.6s ease; }
  .frag.fading { opacity: 0; transform: translateY(-4px); transition: opacity 1.1s ease, transform 1.1s ease; }

  .title-card { text-align: center; opacity: 0; transition: opacity 1s ease; }
  .title-card.visible { opacity: 1; }
  .title-card.fading { opacity: 0; transition: opacity 1s ease; }
  .tc-label { font-family: var(--sans); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream-ghost); margin-bottom: 24px; }
  .tc-title { font-family: var(--brand); font-size: clamp(36px, 6vw, 64px); font-weight: 700; color: var(--cream); margin-bottom: 16px; }
  .tc-author { font-family: var(--sans); font-size: 14px; color: var(--cream-dim); letter-spacing: 0.05em; }
  .tc-duration { font-family: var(--sans); font-size: 11px; color: var(--cream-ghost); margin-top: 8px; letter-spacing: 0.1em; }

  .end-card { text-align: center; opacity: 0; transition: opacity 2s ease; }
  .end-card.visible { opacity: 1; }
  .ec-wordmark { font-family: var(--brand); font-size: 28px; color: var(--cream-ghost); margin-bottom: 24px; letter-spacing: 0.03em; }
  .ec-tagline { font-family: var(--brand); font-size: 18px; font-style: italic; color: var(--pink); opacity: 0.6; margin-bottom: 40px; }
  .ec-back {
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-ghost); text-decoration: none; border: 1px solid rgba(237,232,223,0.06);
    padding: 10px 24px; border-radius: 3px; transition: all 0.4s;
    opacity: 0; animation: fadeIn 1.5s ease 2s forwards;
  }
  .ec-back:hover { color: var(--cream-dim); border-color: rgba(237,232,223,0.12); }
  @keyframes fadeIn { to { opacity: 1; } }

  .progress-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: var(--text-ghost); z-index: 10; opacity: 0; transition: opacity 0.8s ease; }
  .progress-bar.active { opacity: 1; }
  .progress-fill { height: 100%; width: 0%; background: var(--pink); transition: width 0.6s ease; opacity: 0.6; }

  .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 20px 6vw; display: flex; align-items: center; justify-content: space-between; opacity: 0; transition: opacity 0.6s; }
  .top-bar.visible { opacity: 1; }
  .tb-mark { font-family: var(--brand); font-size: 16px; color: var(--cream-ghost); letter-spacing: 0.03em; text-decoration: none; }
  .tb-meta { font-family: var(--sans); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-ghost); }

  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s; }
  .controls.visible { opacity: 1; }
  .ctrl-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    color: var(--cream-ghost); font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em;
    padding: 8px 18px; border-radius: 4px; cursor: pointer; transition: all 0.3s; -webkit-appearance: none; touch-action: manipulation;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: var(--cream-dim); border-color: rgba(255,255,255,0.15); }
  .ctrl-btn--active { background: rgba(123,94,167,0.06); border-color: rgba(123,94,167,0.3); color: var(--pink); }

  /* ─── LIGHT MODE OVERRIDES ─── */
  [data-theme="light"] .ctrl-btn {
    background: rgba(0,0,0,0.04);
    border-color: rgba(0,0,0,0.08);
  }
  [data-theme="light"] .ctrl-btn:hover {
    background: rgba(0,0,0,0.08);
    border-color: rgba(0,0,0,0.12);
  }
  [data-theme="light"] .ctrl-btn--active {
    background: rgba(106,78,150,0.06);
    border-color: rgba(106,78,150,0.35);
  }
  [data-theme="light"] .ec-back {
    border-color: rgba(42,40,36,0.1);
  }
  [data-theme="light"] .ec-back:hover {
    border-color: rgba(42,40,36,0.2);
  }

  /* ─── THEME TOGGLE ─── */
  .theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 50;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-appearance: none;
    pointer-events: none;
  }
  .theme-toggle.visible, .fs-toggle.visible { opacity: 0.35; pointer-events: auto; }

  .fs-toggle {
    position: fixed;
    bottom: 24px;
    right: 60px;
    z-index: 50;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-appearance: none;
    pointer-events: none;
  }
  .fs-toggle:hover { opacity: 0.5; }
  .fs-toggle svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--cream);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.6s ease;
  }
  .theme-toggle:hover { opacity: 0.5; }
  .theme-toggle svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--cream);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.6s ease;
  }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: none; }

  @media (max-width: 600px) {
    .stage { padding: 0 6vw; }
    .top-bar { padding: 16px 5vw; }
    .frag { font-size: clamp(24px, 6.5vw, 36px); }
    .controls { bottom: 20px; }
    .ctrl-btn { padding: 6px 12px; font-size: 10px; }
    .theme-toggle { bottom: 16px; right: 16px; width: 36px; height: 36px; }
    .fs-toggle { bottom: 16px; right: 58px; width: 36px; height: 36px; }
  }

  /* ─── MOBILE LANDSCAPE ─── */
  @media (orientation: landscape) and (max-height: 500px) {
    body { height: var(--app-height, 100dvh); }
    .stage { padding: 0 14vw; }
    .fragment-display { min-height: 60px; }
    .frag { font-size: clamp(17px, 4.5vh, 26px); line-height: 1.4; }
    .tc-title { font-size: clamp(22px, 6vh, 36px); }
    .tc-label { margin-bottom: 10px; font-size: 9px; }
    .tc-author { font-size: 11px; }
    .tc-duration { font-size: 9px; margin-top: 4px; }
    .ec-wordmark { font-size: 18px; margin-bottom: 10px; }
    .ec-tagline { font-size: 13px; margin-bottom: 16px; }
    .ec-back { padding: 7px 18px; font-size: 10px; }
    .top-bar { padding: 10px 4vw; }
    .tb-mark { font-size: 13px; }
    .tb-meta { font-size: 9px; }
    .controls { bottom: 10px; gap: 8px; }
    .ctrl-btn { padding: 4px 10px; font-size: 9px; }
    .theme-toggle { bottom: 10px; right: 10px; }
    .fs-toggle { bottom: 10px; right: 46px; }
    .orb--1 { width: 280px; height: 280px; }
    .orb--2 { width: 220px; height: 220px; }
    .orb--3 { width: 180px; height: 180px; }
    .progress-bar { height: 1.5px; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient">
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
</div>

<div class="stage" id="stage">
  <div class="fragment-display" id="display"></div>
</div>

<div class="top-bar" id="topBar">
  <a href="index.html" class="tb-mark">linger</a>
  <span class="tb-meta" id="tbMeta"></span>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="controls" id="controls">
  <button class="ctrl-btn" id="btnPause">Pause</button>
  <button class="ctrl-btn" id="btnRestart">Restart</button>
  <button class="ctrl-btn" id="btnShare">Share</button>
</div>

<button class="fs-toggle" id="fsToggle" aria-label="Toggle fullscreen">
  <svg class="icon-expand" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  <svg class="icon-compress" style="display:none" viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
</button>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light mode">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<script>
// ═══ VIEWPORT HEIGHT FIX ═══
(function() {
  function setVH() {
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', function() {
    setVH();
    setTimeout(setVH, 100);
    setTimeout(setVH, 300);
    setTimeout(setVH, 500);
  });
})();

// ═══ MOBILE CHROME COLLAPSE ═══
(function() {
  var spacer = document.createElement('div');
  spacer.style.cssText = 'height:calc(100vh + 1px);width:1px;position:absolute;top:0;left:0;pointer-events:none;';
  document.body.appendChild(spacer);
  setTimeout(function() { window.scrollTo(0, 1); }, 100);
  window.addEventListener('orientationchange', function() {
    setTimeout(function() { window.scrollTo(0, 1); }, 300);
  });
})();

// ═══ FULLSCREEN TOGGLE ═══
const fsToggle = document.getElementById('fsToggle');
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsToggle.style.display = 'none';
function enterFs() {
  var el = document.documentElement;
  if (el.requestFullscreen) return el.requestFullscreen();
  if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
  if (el.msRequestFullscreen) return el.msRequestFullscreen();
}
function exitFs() {
  if (document.exitFullscreen) return document.exitFullscreen();
  if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  if (document.msExitFullscreen) return document.msExitFullscreen();
}
function isFs() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
fsToggle.addEventListener('click', function(e) {
  e.stopPropagation();
  try { if (!isFs()) enterFs(); else exitFs(); } catch(err) {}
});
function updateFsIcons() {
  var fs = isFs();
  fsToggle.querySelector('.icon-expand').style.display = fs ? 'none' : 'block';
  fsToggle.querySelector('.icon-compress').style.display = fs ? 'block' : 'none';
}
document.addEventListener('fullscreenchange', updateFsIcons);
document.addEventListener('webkitfullscreenchange', updateFsIcons);

// ═══ THEME TOGGLE ═══
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', function(e) {
  e.stopPropagation();
  var isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('linger-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('linger-theme', 'light');
  }
});

const story = {
  title: "Freedom Hack #9",
  author: "Frances Hahn",
  duration: "~5 min",
  fragments: [
    // ═══ DARK ═══
    { text: "We started in the dark", mood: "void", hold: 3200 },
    { text: "a rustle of midnight in the pitch", mood: "void", hold: 3600 },
    { text: "barely an anything", mood: "void", hold: 2800 },
    { text: "Berlin after the blitz through 35mm film black on black silhouettes", mood: "void", hold: 5200 },
    { text: "so very very cold", mood: "void", hold: 3000 },
    { text: "A spring storm passed over", mood: "void", hold: 3200 },
    { text: "your words swirled", mood: "stir", hold: 2800 },
    { text: "the top spun", mood: "stir", hold: 2600 },

    // ═══ BIRTH ═══
    { text: "This is how stars birth:", mood: "birth", hold: 3400 },
    { text: "a collapse near absolute zero", mood: "birth", hold: 3600 },
    { text: "a breath at ten million years as gas and dust", mood: "birth", hold: 4200 },
    { text: "meet their gravitational maker", mood: "birth", hold: 3600 },
    { text: "the nebula inverts", mood: "birth", hold: 3200 },

    // ═══ NEBULA ═══
    { text: "we are born in thick clouds and cloaks that shimmer with stellar wind", mood: "nebula", hold: 5000 },
    { text: "(Chandra and Hubble overlaid)", mood: "nebula", hold: 3200 },
    { text: "green and blue laced with purple lilac", mood: "nebula", hold: 4000 },
    { text: "cosmic mist", mood: "nebula", hold: 2800 },

    // ═══ CLUSTER ═══
    { text: "Truth is stars are not born alone", mood: "cluster", hold: 3800 },
    { text: "not paired but in clusters", mood: "cluster", hold: 3200 },
    { text: "Two families become kin by deception", mood: "cluster", hold: 3800 },
    { text: "linked like a paper chain at a child\u2019s party", mood: "cluster", hold: 4200 },
    { text: "joyful and destined for the blue bin", mood: "cluster", hold: 3800 },
    { text: "the colour of distance desire", mood: "cluster", hold: 3400 },
    { text: "the starbirth sparklers on cake", mood: "wonder", hold: 3400 },
    { text: "within confetti clouds", mood: "wonder", hold: 3000 },

    // ═══ WONDER ═══
    { text: "The whim of it! Just imagine!", mood: "wonder", hold: 3600 },
    { text: "Interstellar matter", mood: "wonder", hold: 2800 },
    { text: "(Found lying about between other Suns)", mood: "wonder", hold: 3800 },
    { text: "Attracted to itself", mood: "fusion", hold: 3000 },
    { text: "a fantasy of fusion and heat", mood: "fusion", hold: 3600 },
    { text: "free falls into being", mood: "fusion", hold: 3200 },
    { text: "love unplanned", mood: "fusion", hold: 3200 },

    // ═══ CONVERGENCE ═══
    { text: "Richer than the saccharine serendipity of paths crossed:", mood: "converge", hold: 4800 },
    { text: "clouds fragment, particles cling", mood: "converge", hold: 3600 },
    { text: "lean towards light", mood: "converge", hold: 4000 },
  ]
};

// ═══ DOM ═══
const display = document.getElementById('display');
const ambient = document.getElementById('ambient');
const stage = document.getElementById('stage');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const topBar = document.getElementById('topBar');
const tbMeta = document.getElementById('tbMeta');
const controls = document.getElementById('controls');
const btnPause = document.getElementById('btnPause');
const btnRestart = document.getElementById('btnRestart');

let currentIndex = -1;
let isPaused = false;
let timeoutId = null;
let hasStarted = false;

const FADE_OUT = 700;
const GAP = 400;
const MAX_VOLUME = 0.15;

// ═══ ROOM TONE — plain <audio> element, no Web Audio API ═══
var ambientAudio = null;
var ambientPlaying = false;
var ambientFadeTimer = null;

(function createAmbient() {
  ambientAudio = document.createElement('audio');
  ambientAudio.src = 'tone-deep-presence.mp3';
  ambientAudio.loop = true;
  ambientAudio.volume = 0;
  ambientAudio.preload = 'metadata';
  ambientAudio.setAttribute('playsinline', '');
  ambientAudio.setAttribute('webkit-playsinline', '');
  ambientAudio.style.display = 'none';
  document.body.appendChild(ambientAudio);
  console.log('[linger] ambient audio element created, src: tone-deep-presence.mp3');
  ambientAudio.addEventListener('canplaythrough', function() {
    console.log('[linger] ambient audio ready to play');
  }, { once: true });
  ambientAudio.addEventListener('error', function(e) {
    console.warn('[linger] ambient audio error:', ambientAudio.error);
  });
})();

function startRoomTone() {
  if (!ambientAudio) return;
  ambientAudio.volume = MAX_VOLUME;
  var p = ambientAudio.play();
  if (p !== undefined) {
    p.then(function() {
      ambientPlaying = true;
      console.log('[linger] audio started, vol:', ambientAudio.volume, 'paused:', ambientAudio.paused);
      setTimeout(function() {
        if (ambientAudio.paused) {
          console.log('[linger] audio was paused by browser, retrying...');
          ambientAudio.play();
        }
      }, 200);
    }).catch(function(err) {
      console.warn('[linger] play blocked:', err.message);
      ambientPlaying = false;
    });
  }
}

function fadeOutRoomTone() {
  if (!ambientAudio || !ambientPlaying) return;
  if (ambientFadeTimer) { clearInterval(ambientFadeTimer); ambientFadeTimer = null; }
  var fade = setInterval(function() {
    var v = ambientAudio.volume - (MAX_VOLUME / 60);
    if (v <= 0) {
      v = 0;
      clearInterval(fade);
      try { ambientAudio.pause(); } catch(e) {}
      ambientPlaying = false;
    }
    try { ambientAudio.volume = v; } catch(e) {}
  }, 100);
}

// ═══ AUTO-START ═══
stage.classList.add('active');
progressBar.classList.add('active');
hasStarted = true;

var audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked || !ambientAudio) return;
  if (ambientAudio.paused) {
    ambientAudio.volume = MAX_VOLUME;
    ambientAudio.play().then(function() {
      ambientPlaying = true;
      audioUnlocked = true;
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
      document.removeEventListener('touchend', unlockAudio);
    }).catch(function() {});
  }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('keydown', unlockAudio);
document.addEventListener('touchend', unlockAudio);
startRoomTone();

showCurrent();

function renderTitleCard() {
  display.innerHTML = `
    <div class="title-card" id="currentEl">
      <div class="tc-label">linger presents</div>
      <div class="tc-title">${story.title}</div>
      <div class="tc-author">${story.author}</div>
      <div class="tc-duration">${story.duration}</div>
    </div>`;
}
function renderFragment(index) {
  const f = story.fragments[index];
  const firstClass = index === 0 ? ' first' : '';
  display.innerHTML = `<div class="frag${firstClass}" id="currentEl">${f.text}</div>`;
}
function renderEndCard() {
  display.innerHTML = `
    <div class="end-card" id="currentEl">
      <div class="ec-wordmark">linger</div>
      <div class="ec-tagline">Attention, rewarded.</div>
      <a href="index.html" class="ec-back">Back to stories</a>
    </div>`;
}
function setMood(mood) { ambient.className = 'ambient mood-' + (mood || 'void'); }
function updateProgress() {
  const total = story.fragments.length;
  const pct = currentIndex < 0 ? 0 : Math.min(((currentIndex + 1) / total) * 100, 100);
  progressFill.style.width = pct + '%';
}
function updateMeta() {
  if (currentIndex < 0) tbMeta.textContent = '';
  else if (currentIndex >= story.fragments.length) tbMeta.textContent = 'fin';
  else tbMeta.textContent = (currentIndex + 1) + ' / ' + story.fragments.length;
}

function showCurrent() {
  updateProgress();
  updateMeta();
  if (currentIndex < 0) {
    renderTitleCard();
    setMood('void');
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    timeoutId = setTimeout(() => fadeAndAdvance(), 7000);
    setTimeout(() => topBar.classList.add('visible'), 1200);
  } else if (currentIndex >= story.fragments.length) {
    renderEndCard();
    setMood('converge');
    progressFill.style.width = '100%';
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    setTimeout(() => fadeOutRoomTone(), 3000);
  } else {
    const f = story.fragments[currentIndex];
    renderFragment(currentIndex);
    setMood(f.mood);
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    timeoutId = setTimeout(() => fadeAndAdvance(), f.hold);
  }
}

function fadeAndAdvance() {
  const el = document.getElementById('currentEl');
  if (!el) return;
  el.classList.remove('visible');
  el.classList.add('fading');
  timeoutId = setTimeout(() => { currentIndex++; showCurrent(); }, FADE_OUT + GAP);
}

btnPause.addEventListener('click', () => {
  if (isPaused) { isPaused = false; btnPause.textContent = 'Pause'; btnPause.classList.remove('ctrl-btn--active'); showCurrent(); }
  else { isPaused = true; btnPause.textContent = 'Resume'; btnPause.classList.add('ctrl-btn--active'); clearTimeout(timeoutId); }
});
btnRestart.addEventListener('click', () => {
  clearTimeout(timeoutId); isPaused = false; btnPause.textContent = 'Pause'; btnPause.classList.remove('ctrl-btn--active');
  currentIndex = -1; topBar.classList.remove('visible'); showCurrent();
});
document.getElementById('btnShare').addEventListener('click', () => {
  // Pause the reading
  if (!isPaused) { isPaused = true; btnPause.textContent = 'Resume'; btnPause.classList.add('ctrl-btn--active'); clearTimeout(timeoutId); }
  var el = document.getElementById('currentEl');
  var phrase = el ? el.textContent.trim() : '';
  if (!phrase) return;

  var W = 1080, H = 1080;
  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  // Background with subtle radial gradient
  var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  bg.addColorStop(0, '#111114');
  bg.addColorStop(1, '#08080a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle purple orb top-right
  var orb = ctx.createRadialGradient(W*0.8, H*0.15, 0, W*0.8, H*0.15, 300);
  orb.addColorStop(0, 'rgba(123,94,167,0.06)');
  orb.addColorStop(1, 'rgba(123,94,167,0)');
  ctx.fillStyle = orb;
  ctx.fillRect(0, 0, W, H);

  // Subtle blue orb bottom-left
  var orb2 = ctx.createRadialGradient(W*0.2, H*0.85, 0, W*0.2, H*0.85, 250);
  orb2.addColorStop(0, 'rgba(74,127,181,0.04)');
  orb2.addColorStop(1, 'rgba(74,127,181,0)');
  ctx.fillStyle = orb2;
  ctx.fillRect(0, 0, W, H);

  // Word-wrap helper
  function wrapText(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else { line = test; }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Draw quote
  document.fonts.ready.then(function() {
    var margin = 120;
    var maxTextW = W - margin * 2;

    // Quote marks
    ctx.fillStyle = 'rgba(123,94,167,0.15)';
    ctx.font = 'italic 200px "Playfair Display", Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText('\u201C', margin - 30, H * 0.32);

    // Quote text
    ctx.fillStyle = '#ede8df';
    var fontSize = phrase.length > 120 ? 36 : phrase.length > 60 ? 44 : 52;
    ctx.font = 'italic ' + fontSize + 'px "Source Serif 4", Georgia, serif';
    ctx.textAlign = 'center';
    var lines = wrapText(phrase, maxTextW);
    var lineH = fontSize * 1.6;
    var totalH = lines.length * lineH;
    var startY = (H / 2) - (totalH / 2) + fontSize * 0.5;
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, startY + i * lineH);
    }

    // Thin accent line
    var lineY = startY + lines.length * lineH + 40;
    ctx.strokeStyle = 'rgba(123,94,167,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W/2 - 40, lineY);
    ctx.lineTo(W/2 + 40, lineY);
    ctx.stroke();

    // "from [title]"
    ctx.fillStyle = 'rgba(123,94,167,0.5)';
    ctx.font = 'italic 28px "Playfair Display", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('from ' + story.title + ' by ' + story.author, W / 2, lineY + 50);

    // Brand wordmark at bottom
    ctx.fillStyle = 'rgba(237,232,223,0.1)';
    ctx.font = '400 32px "Playfair Display", Georgia, serif';
    ctx.fillText('linger', W / 2, H - 60);

    // Convert to blob and share
    canvas.toBlob(function(blob) {
      var file = new File([blob], 'linger-' + story.title.toLowerCase().replace(/\s+/g,'-') + '.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'linger \u2014 ' + story.title }).catch(function() {});
      } else {
        // Desktop fallback: download
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        a.click();
        URL.revokeObjectURL(a.href);
        var btn = document.getElementById('btnShare');
        btn.textContent = 'Saved'; setTimeout(function() { btn.textContent = 'Share'; }, 1500);
      }
    }, 'image/png');
  });
});

let mouseTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-cursor');
  if (hasStarted) { controls.classList.add('visible'); themeToggle.classList.add('visible'); fsToggle.classList.add('visible'); }
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => { if (!isPaused) { controls.classList.remove('visible'); themeToggle.classList.remove('visible'); fsToggle.classList.remove('visible'); document.body.classList.remove('show-cursor'); } }, 2500);
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); btnPause.click(); }
  if (e.code === 'ArrowRight' && !isPaused) { clearTimeout(timeoutId); fadeAndAdvance(); }
  if (e.code === 'KeyR') btnRestart.click();
  if (e.code === 'KeyF') fsToggle.click();
});
document.addEventListener('touchstart', () => {
  if (hasStarted) { controls.classList.add('visible'); themeToggle.classList.add('visible'); fsToggle.classList.add('visible'); }
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => { if (!isPaused) { controls.classList.remove('visible'); themeToggle.classList.remove('visible'); fsToggle.classList.remove('visible'); } }, 3000);
});
</script>
</body>
