<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>linger</title>
<script>(function(){var t=localStorage.getItem('linger-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root {
    --void: #08080a;
    --surface: #111114;
    --border: #1e1e22;
    --text-ghost: #2a2a2e;
    --cream: #ede8df;
    --cream-dim: rgba(237,232,223,0.6);
    --cream-ghost: rgba(237,232,223,0.15);
    --pink: #d4a0a0;
    --green: #8bab90;
    --reading: 'Source Serif 4', Georgia, serif;
    --brand: 'Playfair Display', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
  }

  [data-theme="light"] {
    --void: #f5f2ec;
    --surface: #ebe7e0;
    --border: rgba(42,40,36,0.08);
    --text-ghost: rgba(42,40,36,0.18);
    --cream: #2a2824;
    --cream-dim: rgba(42,40,36,0.55);
    --cream-ghost: rgba(42,40,36,0.15);
    --pink: #b87878;
    --green: #6a8a6e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { transition: background-color 0.6s ease; background: var(--void); }
  body {
    background: var(--void);
    color: var(--cream);
    font-family: var(--reading);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    width: 100vw;
    user-select: none;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.6s ease, color 0.6s ease;
  }
  body.show-cursor { cursor: default; }

  /* ─── START PAGE ─── */
  .start-page {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 1.8s ease;
  }
  .start-page.hidden { opacity: 0; pointer-events: none; }

  .start-ambient {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .start-ambient .s-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(160px);
    opacity: 0;
    transition: opacity 4s ease, transform 12s ease;
  }
  .start-ambient .s-orb--1 {
    width: 600px; height: 600px;
    background: var(--green);
    top: -25%; right: -15%;
  }
  .start-ambient .s-orb--2 {
    width: 450px; height: 450px;
    background: #5a6a5a;
    bottom: -20%; left: -12%;
  }
  .start-ambient .s-orb--3 {
    width: 300px; height: 300px;
    background: var(--pink);
    top: 50%; left: 30%;
  }
  .start-page.active .s-orb--1 { opacity: 0.06; transform: translate(-10px, 10px); }
  .start-page.active .s-orb--2 { opacity: 0.04; transform: translate(10px, -5px); }
  .start-page.active .s-orb--3 { opacity: 0.03; transform: translate(5px, -10px); }

  .start-content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 560px;
    padding: 0 6vw;
  }
  .start-wordmark {
    font-family: var(--brand);
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 400;
    color: var(--cream);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.6s ease 0.3s, transform 1.6s ease 0.3s;
  }
  .start-page.active .start-wordmark { opacity: 1; transform: translateY(0); }
  .start-tagline {
    font-family: var(--brand);
    font-size: clamp(14px, 2.2vw, 18px);
    font-style: italic;
    color: var(--cream-dim);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1.4s ease 1s, transform 1.4s ease 1s;
    margin-bottom: 64px;
  }
  .start-page.active .start-tagline { opacity: 0.7; transform: translateY(0); }
  .start-divider {
    width: 40px;
    height: 1px;
    background: var(--cream-ghost);
    margin: 0 auto 48px;
    opacity: 0;
    transition: opacity 1.2s ease 1.6s;
  }
  .start-page.active .start-divider { opacity: 1; }
  .start-story-title {
    font-family: var(--brand);
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 400;
    font-style: italic;
    color: var(--cream);
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1.4s ease 2s, transform 1.4s ease 2s;
  }
  .start-page.active .start-story-title { opacity: 1; transform: translateY(0); }
  .start-author {
    font-family: var(--sans);
    font-size: clamp(12px, 1.6vw, 15px);
    color: var(--cream-dim);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    opacity: 0;
    transition: opacity 1.2s ease 2.4s;
  }
  .start-page.active .start-author { opacity: 1; }
  .start-duration {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--cream-ghost);
    letter-spacing: 0.12em;
    margin-bottom: 56px;
    opacity: 0;
    transition: opacity 1.2s ease 2.6s;
  }
  .start-page.active .start-duration { opacity: 1; }
  .start-begin {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream-ghost);
    background: none;
    border: 1px solid rgba(237,232,223,0.08);
    padding: 14px 36px;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.2s ease 3.2s, border-color 0.5s ease, color 0.5s ease, background 0.5s ease;
    -webkit-appearance: none;
  }
  .start-page.active .start-begin { opacity: 1; }
  .start-begin:hover {
    border-color: rgba(212,160,160,0.3);
    color: var(--cream-dim);
    background: rgba(212,160,160,0.06);
  }
  .start-hint {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--text-ghost);
    letter-spacing: 0.1em;
    margin-top: 16px;
    opacity: 0;
    transition: opacity 1s ease 3.8s;
  }
  .start-page.active .start-hint { opacity: 1; }
  @media (pointer: coarse) { .start-hint { display: none; } }

  /* ─── AMBIENT ─── */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0;
    transition: opacity 7s ease, transform 12s ease, background 9s ease;
  }
  .orb--1 { width: 500px; height: 500px; background: var(--green); top: -20%; right: -10%; }
  .orb--2 { width: 400px; height: 400px; background: var(--green); bottom: -25%; left: -10%; }
  .orb--3 { width: 350px; height: 350px; background: var(--green); top: 40%; left: 20%; }

  /* night run — wary routine */
  .mood-wary .orb--1 { opacity: 0.06; background: var(--green); transform: translate(0,0); }
  .mood-wary .orb--2 { opacity: 0.03; background: #5a6a5a; }
  .mood-wary .orb--3 { opacity: 0.04; background: #6a7a6a; }

  /* efficiency / routine pride */
  .mood-hustle .orb--1 { opacity: 0.08; background: var(--green); transform: translate(-5px, 5px); }
  .mood-hustle .orb--2 { opacity: 0.05; background: var(--pink); }
  .mood-hustle .orb--3 { opacity: 0.03; }

  /* tenderness — kimmy */
  .mood-tender .orb--1 { opacity: 0.05; background: var(--green); }
  .mood-tender .orb--2 { opacity: 0.06; background: var(--green); transform: translate(5px, -5px); }
  .mood-tender .orb--3 { opacity: 0.04; background: var(--green); }

  /* exposure — outside, alert */
  .mood-exposed .orb--1 { opacity: 0.1; background: #7a8a7a; transform: translate(-10px, 10px) scale(1.05); }
  .mood-exposed .orb--2 { opacity: 0.04; background: #5a6a5e; }
  .mood-exposed .orb--3 { opacity: 0.03; }

  /* threat — danger */
  .mood-threat .orb--1 { opacity: 0.16; background: var(--pink); transform: translate(-20px, 15px) scale(1.1); }
  .mood-threat .orb--2 { opacity: 0.06; background: #8a6a6a; transform: translate(10px, -10px); }
  .mood-threat .orb--3 { opacity: 0.02; }

  /* defiant — told you so */
  .mood-defiant .orb--1 { opacity: 0.08; background: var(--pink); }
  .mood-defiant .orb--2 { opacity: 0.06; background: var(--green); transform: translate(5px, 0); }
  .mood-defiant .orb--3 { opacity: 0.05; background: #7a8a7a; }

  /* paranoid — tingle, anxiety */
  .mood-paranoid .orb--1 { opacity: 0.14; background: #6a7a6a; transform: translate(-15px, 10px) scale(1.08); }
  .mood-paranoid .orb--2 { opacity: 0.08; background: #5a6a5a; transform: translate(10px, -8px); }
  .mood-paranoid .orb--3 { opacity: 0.06; background: #5a6a5a; }

  /* sanctuary — inside the bus */
  .mood-sanctuary .orb--1 { opacity: 0.05; background: var(--green); }
  .mood-sanctuary .orb--2 { opacity: 0.04; background: var(--green); }
  .mood-sanctuary .orb--3 { opacity: 0.06; background: #7a8a7a; transform: translate(0, -5px); }

  /* violence */
  .mood-violence .orb--1 { opacity: 0.2; background: var(--pink); transform: translate(-25px, 15px) scale(1.15); }
  .mood-violence .orb--2 { opacity: 0.08; background: #8a6a6a; transform: translate(15px, -10px); }
  .mood-violence .orb--3 { opacity: 0.02; }

  /* witness — still, watching */
  .mood-witness .orb--1 { opacity: 0.04; background: #6a7a6a; }
  .mood-witness .orb--2 { opacity: 0.03; background: #5a6a5e; }
  .mood-witness .orb--3 { opacity: 0.02; }

  /* end — closed curtain */
  .mood-closed .orb--1 { opacity: 0.03; background: var(--cream); transform: translate(0, -5px); }
  .mood-closed .orb--2 { opacity: 0.02; }
  .mood-closed .orb--3 { opacity: 0.02; }

  /* ─── STAGE ─── */
  .stage {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 8vw; opacity: 0; transition: opacity 1.2s ease;
  }
  .stage.active { opacity: 1; }
  .fragment-display {
    max-width: 680px; text-align: center; min-height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .frag {
    font-family: var(--reading);
    font-size: clamp(26px, 3.8vw, 42px);
    font-weight: 400; line-height: 1.5; color: var(--cream);
    opacity: 0; transform: translateY(6px);
    transition: opacity 1s ease, transform 1s ease;
    text-wrap: balance;
  }
  .frag.visible { opacity: 1; transform: translateY(0); }
  .frag.first { transition: opacity 1.6s ease, transform 1.6s ease; }
  .frag.fading { opacity: 0; transform: translateY(-4px); transition: opacity 1.1s ease, transform 1.1s ease; }

  .title-card { text-align: center; opacity: 0; transition: opacity 2s ease; }
  .title-card.visible { opacity: 1; }
  .title-card.fading { opacity: 0; transition: opacity 1.8s ease; }
  .tc-label { font-family: var(--sans); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream-ghost); margin-bottom: 24px; }
  .tc-title { font-family: var(--brand); font-size: clamp(36px, 6vw, 64px); font-weight: 700; color: var(--cream); margin-bottom: 16px; }
  .tc-author { font-family: var(--sans); font-size: 14px; color: var(--cream-dim); letter-spacing: 0.05em; }
  .tc-duration { font-family: var(--sans); font-size: 11px; color: var(--cream-ghost); margin-top: 8px; letter-spacing: 0.1em; }

  .end-card { text-align: center; opacity: 0; transition: opacity 2s ease; }
  .end-card.visible { opacity: 1; }
  .ec-wordmark { font-family: var(--brand); font-size: 28px; color: var(--cream-ghost); margin-bottom: 24px; letter-spacing: 0.03em; }
  .ec-tagline { font-family: var(--brand); font-size: 18px; font-style: italic; color: var(--pink); opacity: 0.6; margin-bottom: 40px; }
  .ec-back {
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-ghost); text-decoration: none; border: 1px solid rgba(237,232,223,0.06);
    padding: 10px 24px; border-radius: 3px; transition: all 0.4s;
    opacity: 0; animation: fadeIn 1.5s ease 2s forwards;
  }
  .ec-back:hover { color: var(--cream-dim); border-color: rgba(237,232,223,0.12); }
  @keyframes fadeIn { to { opacity: 1; } }

  .progress-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: var(--text-ghost); z-index: 10; opacity: 0; transition: opacity 0.8s ease; }
  .progress-bar.active { opacity: 1; }
  .progress-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.6s ease; opacity: 0.6; }

  .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 20px 6vw; display: flex; align-items: center; justify-content: space-between; opacity: 0; transition: opacity 0.6s; }
  .top-bar.visible { opacity: 1; }
  .tb-mark { font-family: var(--brand); font-size: 16px; color: var(--cream-ghost); letter-spacing: 0.03em; text-decoration: none; }
  .tb-meta { font-family: var(--sans); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-ghost); }

  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s; }
  .controls.visible { opacity: 1; }
  .ctrl-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    color: var(--cream-ghost); font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em;
    padding: 8px 18px; border-radius: 4px; cursor: pointer; transition: all 0.3s; -webkit-appearance: none;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: var(--cream-dim); border-color: rgba(255,255,255,0.15); }
  .ctrl-btn--active { background: rgba(212,160,160,0.08); border-color: rgba(212,160,160,0.15); color: var(--pink); }

  /* ─── LIGHT MODE OVERRIDES ─── */
  [data-theme="light"] .ctrl-btn {
    background: rgba(0,0,0,0.04);
    border-color: rgba(0,0,0,0.08);
  }
  [data-theme="light"] .ctrl-btn:hover {
    background: rgba(0,0,0,0.08);
    border-color: rgba(0,0,0,0.12);
  }
  [data-theme="light"] .ctrl-btn--active {
    background: rgba(184,120,120,0.06);
    border-color: rgba(184,120,120,0.18);
  }
  [data-theme="light"] .ec-back {
    border-color: rgba(42,40,36,0.1);
  }
  [data-theme="light"] .ec-back:hover {
    border-color: rgba(42,40,36,0.2);
  }

  /* ─── THEME TOGGLE ─── */
  .theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 50;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-appearance: none;
    pointer-events: none;
  }
  .theme-toggle.visible, .fs-toggle.visible { opacity: 0.2; pointer-events: auto; }
  .theme-toggle:hover { opacity: 0.5; }

  .fs-toggle {
    position: fixed;
    bottom: 24px;
    right: 60px;
    z-index: 50;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
    -webkit-appearance: none;
    pointer-events: none;
  }
  .fs-toggle:hover { opacity: 0.5; }
  .fs-toggle svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--cream);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.6s ease;
  }
  .theme-toggle svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--cream);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.6s ease;
  }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: none; }

  @media (max-width: 600px) {
    .stage { padding: 0 6vw; }
    .top-bar { padding: 16px 5vw; }
    .frag { font-size: clamp(20px, 5vw, 30px); }
    .start-wordmark { font-size: clamp(36px, 10vw, 56px); }
    .start-story-title { font-size: clamp(24px, 7vw, 40px); }
    .controls { bottom: 20px; }
    .ctrl-btn { padding: 6px 12px; font-size: 10px; }
    .theme-toggle { bottom: 16px; right: 16px; }
    .fs-toggle { bottom: 16px; right: 52px; }
  }

  /* ─── MOBILE LANDSCAPE ─── */
  @media (orientation: landscape) and (max-height: 500px) {
    body { height: 100dvh; }
    .start-page { padding: 3vh 10vw; }
    .start-wordmark { font-size: clamp(24px, 5vh, 36px); margin-bottom: 8px; }
    .start-story-title { font-size: clamp(18px, 4vh, 28px); margin-bottom: 8px; }
    .start-author { font-size: 11px; }
    .start-begin { padding: 8px 24px; font-size: 11px; margin-top: 12px; }
    .stage { padding: 0 14vw; }
    .fragment-display { min-height: 60px; }
    .frag { font-size: clamp(15px, 3.5vh, 22px); line-height: 1.4; }
    .tc-title { font-size: clamp(22px, 6vh, 36px); }
    .tc-label { margin-bottom: 10px; font-size: 9px; }
    .tc-author { font-size: 11px; }
    .tc-duration { font-size: 9px; margin-top: 4px; }
    .ec-wordmark { font-size: 18px; margin-bottom: 10px; }
    .ec-tagline { font-size: 13px; margin-bottom: 16px; }
    .ec-back { padding: 7px 18px; font-size: 10px; }
    .top-bar { padding: 10px 4vw; }
    .tb-mark { font-size: 13px; }
    .tb-meta { font-size: 9px; }
    .controls { bottom: 10px; gap: 8px; }
    .ctrl-btn { padding: 4px 10px; font-size: 9px; }
    .theme-toggle { bottom: 10px; right: 10px; }
    .fs-toggle { bottom: 10px; right: 46px; }
    .orb--1 { width: 280px; height: 280px; }
    .orb--2 { width: 220px; height: 220px; }
    .orb--3 { width: 180px; height: 180px; }
    .progress-bar { height: 1.5px; }
  }
</style>
</head>
<body>

<div class="start-page" id="startPage">
  <div class="start-ambient">
    <div class="s-orb s-orb--1"></div>
    <div class="s-orb s-orb--2"></div>
    <div class="s-orb s-orb--3"></div>
  </div>
  <div class="start-content">
    <div class="start-wordmark">linger</div>
    <div class="start-tagline">Attention, rewarded.</div>
    <div class="start-divider"></div>
    <div class="start-story-title">Night At The Plaza</div>
    <div class="start-author">Jon T</div>
    <div class="start-duration">~14 min</div>
    <button class="start-begin" id="btnBegin">Begin</button>
    <div class="start-hint">or press space</div>
  </div>
</div>

<div class="ambient" id="ambient">
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
</div>

<div class="stage" id="stage">
  <div class="fragment-display" id="display"></div>
</div>

<div class="top-bar" id="topBar">
  <a href="index.html" class="tb-mark">linger</a>
  <span class="tb-meta" id="tbMeta"></span>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="controls" id="controls">
  <button class="ctrl-btn" id="btnPause">Pause</button>
  <button class="ctrl-btn" id="btnRestart">Restart</button>
  <button class="ctrl-btn" id="btnShare">Share</button>
</div>

<button class="fs-toggle" id="fsToggle" aria-label="Toggle fullscreen">
  <svg class="icon-expand" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  <svg class="icon-compress" style="display:none" viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
</button>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light mode">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<script>
// ═══ VIEWPORT HEIGHT FIX ═══
(function() {
  function setVH() {
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', function() {
    setTimeout(setVH, 150);
  });
})();

// ═══ FULLSCREEN TOGGLE ═══
const fsToggle = document.getElementById('fsToggle');
fsToggle.addEventListener('click', function(e) {
  e.stopPropagation();
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    var el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});
function updateFsIcons() {
  var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsToggle.querySelector('.icon-expand').style.display = isFs ? 'none' : 'block';
  fsToggle.querySelector('.icon-compress').style.display = isFs ? 'block' : 'none';
}
document.addEventListener('fullscreenchange', updateFsIcons);
document.addEventListener('webkitfullscreenchange', updateFsIcons);

// ═══ THEME TOGGLE ═══
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', function(e) {
  e.stopPropagation();
  var isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('linger-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('linger-theme', 'light');
  }
});

const story = {
  title: "Night At The Plaza",
  author: "Jon T",
  duration: "14 min",
  fragments: [
    // ═══ FOOD RUN ═══
    { text: "Shaved at least a minute off the food run since I showed Kimmy my secret knock.", mood: "hustle", hold: 4400 },
    { text: "I keep track of exposure time, write it down in the log.", mood: "wary", hold: 3600 },
    { text: "She gives me a medium bag full of day-olds tonight,", mood: "tender", hold: 3400 },
    { text: "and I give her the good lucky salute and thank her for her service.", mood: "tender", hold: 4200 },
    { text: "Makes me a little sad in the corners knowing she won\u2019t have long now.", mood: "tender", hold: 4400 },
    { text: "Don\u2019t know how she\u2019s made it this far, workin\u2019 Daddy Donuts till the clock runs out.", mood: "tender", hold: 4800 },
    { text: "I tell her about the ghoul gas but she always just shrugs it off with a \u2018poor-you smile,", mood: "tender", hold: 4600 },
    { text: "like I\u2019m the crazy one.", mood: "defiant", hold: 2600 },

    // ═══ THE CROSSING ═══
    { text: "It\u2019s a hundred-yard skedaddle back to the short bus \u2018cross the customers only blacktop,", mood: "exposed", hold: 5000 },
    { text: "top-lit with just a couple of penta-beam floods, shinin\u2019 down eternal, like midnight sentries\u2014", mood: "exposed", hold: 4800 },
    { text: "\u2018cept those eyes haven\u2019t any armies.", mood: "exposed", hold: 3000 },
    { text: "Right?", mood: "exposed", hold: 1800 },
    { text: "Nothing to dangle down and swat away the coyotes.", mood: "exposed", hold: 3600 },

    // ═══ THE LOCALS ═══
    { text: "At 11:34, I see some everdeads takin\u2019 a piss on the back door of \u2018Ol Schooly.", mood: "threat", hold: 4600 },
    { text: "And I wouldn\u2019t care so much but I need to get back in my wheelhouse without a bunch of messin\u2019 around with the locals.", mood: "wary", hold: 5400 },
    { text: "The murder mist\u2019ll take care of them sooner or later.", mood: "defiant", hold: 3600 },
    { text: "I just gotta get back in the mobile, breathin\u2019 that sweet O asap\u2014scrubby clean and toxin-free.", mood: "hustle", hold: 4800 },
    { text: "I think about dashin\u2019 but It\u2019ll just fuzz-out my ventilator and make a scene", mood: "wary", hold: 4400 },
    { text: "so I calculate a quick alt, de-smear my goggs with the fleecy inside of my hoodie,", mood: "hustle", hold: 4600 },
    { text: "and start walking the long way around the perimeter.", mood: "exposed", hold: 3400 },
    { text: "This is gonna fuck with my timings but I aint prepared to do battle with these two unsavoury mutánte delectos.", mood: "wary", hold: 5200 },

    // ═══ THE LOT ═══
    { text: "I keep my side-eye scopin\u2019 around the mostly empty lot.", mood: "paranoid", hold: 3600 },
    { text: "My adopted homeland and refuge,", mood: "sanctuary", hold: 2800 },
    { text: "I am intimately familiar with every yellow bracket, every crack and curb, and every smear-stained patch of slick on this urban pasture.", mood: "sanctuary", hold: 5800 },
    { text: "And this evening, I am sharply aware of a dangerous tingle transmittin\u2019 from a white \u2018n blue capback parked in the corner, in front of Lucky Foot Massage.", mood: "paranoid", hold: 6000 },
    { text: "Looks like security.", mood: "paranoid", hold: 2400 },

    // ═══ GETTING IN ═══
    { text: "The pair behind the bus are groping at each other\u2019s pants now.", mood: "threat", hold: 3800 },
    { text: "They\u2019re leanin\u2019 on my back wheels so I can probably strafe around the far side and get in through my foldy doors while they\u2019re busy tuggin\u2019 and snortin\u2019.", mood: "hustle", hold: 5800 },
    { text: "And as I curbwalk around, swinging my snack bag,", mood: "exposed", hold: 3400 },
    { text: "there\u2019s a cluster of dressy night legs on the boulevard, laughing at my prophylactic body armor and life support apparatus.", mood: "defiant", hold: 5400 },
    { text: "They call me nuts and mock my vigilance", mood: "defiant", hold: 3200 },
    { text: "and I tell them they\u2019ll be dead before sunrise.", mood: "defiant", hold: 3600 },
    { text: "No one ever believes me.", mood: "defiant", hold: 3000 },

    // ═══ HOMEBASE ═══
    { text: "Back in Greater Parkistan, I\u2019m approachin\u2019 homebase,", mood: "wary", hold: 3400 },
    { text: "and I see the headlamps from the security truck light up and hear the annoying dog whine of electric motors creep toward me and my bus,", mood: "paranoid", hold: 5600 },
    { text: "which is now rockin\u2019 on its coil springs with these interlopers playin\u2019 pushy shovey on the side panels, their belts around their ankles.", mood: "threat", hold: 5800 },
    { text: "There\u2019s no decency anymore,", mood: "defiant", hold: 2800 },
    { text: "and I gotta remind myself not to get involved.", mood: "wary", hold: 3200 },
    { text: "Just slip into the habitat and let the strip mall patrol do their job.", mood: "hustle", hold: 4000 },

    // ═══ OLD ELGIN ═══
    { text: "Old Elgin, the New Horizons Pharmacy manager, used to come by every once in a while, pretending to give me a hard time about boondockin\u2019,", mood: "tender", hold: 5600 },
    { text: "but he didn\u2019t bother doin\u2019 anything, long as I kept to myself.", mood: "tender", hold: 3800 },
    { text: "He tells me last week that they\u2019re hirin\u2019 some Gold Falcon Protection Services to keep an eye on the grounds.", mood: "wary", hold: 5200 },
    { text: "Crime\u2019s on the rise, he says,", mood: "wary", hold: 2800 },
    { text: "and I tell him, tapping my tox-ometer, that the only rise going on is an increase in poison particulate in the atmosphere.", mood: "defiant", hold: 5400 },

    // ═══ THE GUARD ═══
    { text: "The thing rolls up and this canvas loaf soldier jumps out of the vehicle with a twenty-pound Maglite swingin\u2019 across the pavement.", mood: "threat", hold: 5400 },
    { text: "He tells the perverts to get the hell outta here", mood: "threat", hold: 3200 },
    { text: "but when they flip him off and jeer recklessly,", mood: "threat", hold: 3200 },
    { text: "he unslings his stun gun and clips one of them in the butt cheeks with the flyin\u2019 shock prongs.", mood: "violence", hold: 5000 },
    { text: "Electro Interruptus and they both go down in comic spasms.", mood: "violence", hold: 4200 },

    // ═══ CONFRONTATION ═══
    { text: "I\u2019m frozen, watching from the front grill, peekin\u2019 \u2018round the corner at the commotion.", mood: "witness", hold: 4600 },
    { text: "The uniform gets up over these two and starts layin\u2019 boots to their half-naked bodies until they unseize themselves and scramble away into the street.", mood: "violence", hold: 5800 },
    { text: "He then turns his attention to me.", mood: "threat", hold: 3200 },
    { text: "I don\u2019t exactly blend in to the surroundings,", mood: "paranoid", hold: 3200 },
    { text: "and I am not oblivious to my unusual presentation", mood: "paranoid", hold: 3400 },
    { text: "but I\u2019m suddenly feeling the tickityticks of anxiety as he up-downs his beam in my direction.", mood: "paranoid", hold: 4800 },

    { text: "They told me about you, he says.", mood: "threat", hold: 3400 },
    { text: "And for a brief moment, I think maybe this is a head-nod acknowledgment of my longstanding tenure here at the plaza.", mood: "tender", hold: 5200 },
    { text: "But then he says I better pack it up and roll on.", mood: "threat", hold: 3600 },
    { text: "Says, letting a paranoid mental case like me camp out here is bad for business.", mood: "threat", hold: 4800 },
    { text: "All I can do is start backing away and hope I can jump inside my quarters before this psycho guardia gets any closer.", mood: "paranoid", hold: 5200 },

    // ═══ INSIDE ═══
    { text: "I drop my bag of donuts and hold up my reflective glove hand like I need five minutes,", mood: "hustle", hold: 4600 },
    { text: "which seems to satisfy him for now.", mood: "wary", hold: 2800 },
    { text: "So I get inside my baby and bar the door.", mood: "sanctuary", hold: 3400 },
    { text: "I see him out the driver-side window just standing there waiting, thunking his flashlight in his puffy palm all threatnin\u2019 like;", mood: "paranoid", hold: 5400 },
    { text: "but I don\u2019t intend on going anywhere anytime soon.", mood: "defiant", hold: 3400 },
    { text: "I need time to decontaminate.", mood: "sanctuary", hold: 2800 },
    { text: "Gotta wash off the world.", mood: "sanctuary", hold: 2600 },
    { text: "Purify.", mood: "sanctuary", hold: 2000 },
    { text: "Shrug off the shadows of the evening and bathe in my UV for an extra long spell considerin\u2019 the major wrinkle in my routine.", mood: "sanctuary", hold: 5600 },

    // ═══ HAMMERING ═══
    { text: "But my ablutions are cut short by that obangatang hammerin\u2019 and yammerin\u2019 outside like he\u2019s the new superintendent of this dreadland.", mood: "threat", hold: 5400 },
    { text: "I\u2019m loathe to do it, but I gear up to inform him of his mistake and assured misfortune", mood: "defiant", hold: 4600 },
    { text: "when I hear more voices.", mood: "threat", hold: 2600 },
    { text: "Maybe four or five.", mood: "threat", hold: 2200 },

    // ═══ THE KILLING ═══
    { text: "So I spread my side curtain and glimpse out into the early morning gauze of night", mood: "witness", hold: 4400 },
    { text: "and see that the horny pals have come back with friends,", mood: "threat", hold: 3600 },
    { text: "and they\u2019re swarming the Gold Falcon with fists and pointy shoes.", mood: "violence", hold: 4200 },
    { text: "And though he\u2019s putting up a good fight, they\u2019ve got him at the knees and pinned his neck down.", mood: "violence", hold: 4800 },
    { text: "One of them grabs my discarded sack of sustenance and flings out the donuts, rolling across the tarmac.", mood: "violence", hold: 5000 },
    { text: "They hood him with the plastic bag and pull it tight.", mood: "violence", hold: 4000 },
    { text: "I can see him trying to gnash and tongue-poke his way through the wrap but it clings close", mood: "violence", hold: 4600 },
    { text: "until his body loosens and sags underneath the gang of assailants.", mood: "violence", hold: 4400 },

    // ═══ AFTERMATH ═══
    { text: "They leave the body and I watch for signs of life.", mood: "witness", hold: 3800 },
    { text: "I look at the rise and fall on the bladder of my CO2 absorber", mood: "witness", hold: 4000 },
    { text: "then back out the window to the Gold Falcon,", mood: "witness", hold: 3000 },
    { text: "but there\u2019s no rise, no fall.", mood: "witness", hold: 3200 },
    { text: "His big blue mass, static, phasing under the lot lights.", mood: "witness", hold: 4200 },

    { text: "A coyote comes and sniffs him out.", mood: "closed", hold: 3400 },
    { text: "Then another.", mood: "closed", hold: 2200 },
    { text: "And another.", mood: "closed", hold: 2200 },
    { text: "I fill my lungs deep and pull my little curtain closed.", mood: "closed", hold: 4600 },
  ]
};

// ═══ DOM ═══
const startPage = document.getElementById('startPage');
const btnBegin = document.getElementById('btnBegin');
const display = document.getElementById('display');
const ambient = document.getElementById('ambient');
const stage = document.getElementById('stage');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const topBar = document.getElementById('topBar');
const tbMeta = document.getElementById('tbMeta');
const controls = document.getElementById('controls');
const btnPause = document.getElementById('btnPause');
const btnRestart = document.getElementById('btnRestart');

let currentIndex = -1;
let isPaused = false;
let timeoutId = null;
let hasStarted = false;

const FADE_OUT = 700;
const GAP = 400;
const MAX_VOLUME = 0.5;

// ═══ ROOM TONE — plain <audio> element, no Web Audio API ═══
var ambientAudio = null;
var ambientPlaying = false;
var ambientFadeTimer = null;

(function createAmbient() {
  ambientAudio = document.createElement('audio');
  ambientAudio.src = 'tone-night-studio.mp3';
  ambientAudio.loop = true;
  ambientAudio.volume = 0;
  ambientAudio.preload = 'metadata';
  ambientAudio.setAttribute('playsinline', '');
  ambientAudio.setAttribute('webkit-playsinline', '');
  ambientAudio.style.display = 'none';
  document.body.appendChild(ambientAudio);
  console.log('[linger] ambient audio element created');
  ambientAudio.addEventListener('canplaythrough', function() {
    console.log('[linger] ambient audio ready to play');
  }, { once: true });
  ambientAudio.addEventListener('error', function(e) {
    console.warn('[linger] ambient audio error:', ambientAudio.error);
  });
})();

function startRoomTone() {
  if (!ambientAudio) return;
  ambientAudio.volume = MAX_VOLUME;
  var p = ambientAudio.play();
  if (p !== undefined) {
    p.then(function() {
      ambientPlaying = true;
      setTimeout(function() {
        if (ambientAudio.paused) ambientAudio.play();
      }, 200);
    }).catch(function(err) {
      ambientPlaying = false;
    });
  }
}

function fadeOutRoomTone() {
  if (!ambientAudio || !ambientPlaying) return;
  if (ambientFadeTimer) { clearInterval(ambientFadeTimer); ambientFadeTimer = null; }
  var fade = setInterval(function() {
    var v = ambientAudio.volume - (MAX_VOLUME / 60);
    if (v <= 0) {
      v = 0;
      clearInterval(fade);
      try { ambientAudio.pause(); } catch(e) {}
      ambientPlaying = false;
    }
    try { ambientAudio.volume = v; } catch(e) {}
  }, 100);
}

// ═══ AUTO-START ═══
startPage.style.display = 'none';
stage.classList.add('active');
progressBar.classList.add('active');
hasStarted = true;

function unlockAudio() {
  if (ambientAudio && ambientAudio.paused) {
    ambientAudio.volume = MAX_VOLUME;
    ambientAudio.play().then(function() { ambientPlaying = true; }).catch(function() {});
  }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('keydown', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('touchend', unlockAudio);
startRoomTone();

setTimeout(() => showCurrent(), 800);

function renderTitleCard() {
  display.innerHTML = `
    <div class="title-card" id="currentEl">
      <div class="tc-label">linger presents</div>
      <div class="tc-title">${story.title}</div>
      <div class="tc-author">${story.author}</div>
      <div class="tc-duration">${story.duration}</div>
    </div>`;
}
function renderFragment(index) {
  const f = story.fragments[index];
  const firstClass = index === 0 ? ' first' : '';
  display.innerHTML = `<div class="frag${firstClass}" id="currentEl">${f.text}</div>`;
}
function renderEndCard() {
  display.innerHTML = `
    <div class="end-card" id="currentEl">
      <div class="ec-wordmark">linger</div>
      <div class="ec-tagline">Attention, rewarded.</div>
      <a href="index.html" class="ec-back">Back to stories</a>
    </div>`;
}
function setMood(mood) { ambient.className = 'ambient mood-' + (mood || 'wary'); }
function updateProgress() {
  const total = story.fragments.length;
  const pct = currentIndex < 0 ? 0 : Math.min(((currentIndex + 1) / total) * 100, 100);
  progressFill.style.width = pct + '%';
}
function updateMeta() {
  if (currentIndex < 0) tbMeta.textContent = '';
  else if (currentIndex >= story.fragments.length) tbMeta.textContent = 'fin';
  else tbMeta.textContent = (currentIndex + 1) + ' / ' + story.fragments.length;
}

function showCurrent() {
  updateProgress();
  updateMeta();
  if (currentIndex < 0) {
    renderTitleCard();
    setMood('wary');
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    timeoutId = setTimeout(() => fadeAndAdvance(), 7000);
    setTimeout(() => topBar.classList.add('visible'), 3000);
  } else if (currentIndex >= story.fragments.length) {
    renderEndCard();
    setMood('closed');
    progressFill.style.width = '100%';
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    setTimeout(() => fadeOutRoomTone(), 3000);
  } else {
    const f = story.fragments[currentIndex];
    renderFragment(currentIndex);
    setMood(f.mood);
    requestAnimationFrame(() => { requestAnimationFrame(() => { document.getElementById('currentEl').classList.add('visible'); }); });
    timeoutId = setTimeout(() => fadeAndAdvance(), f.hold);
  }
}

function fadeAndAdvance() {
  const el = document.getElementById('currentEl');
  if (!el) return;
  el.classList.remove('visible');
  el.classList.add('fading');
  timeoutId = setTimeout(() => { currentIndex++; showCurrent(); }, FADE_OUT + GAP);
}

btnPause.addEventListener('click', () => {
  if (isPaused) { isPaused = false; btnPause.textContent = 'Pause'; btnPause.classList.remove('ctrl-btn--active'); showCurrent(); }
  else { isPaused = true; btnPause.textContent = 'Resume'; btnPause.classList.add('ctrl-btn--active'); clearTimeout(timeoutId); }
});
btnRestart.addEventListener('click', () => {
  clearTimeout(timeoutId); isPaused = false; btnPause.textContent = 'Pause'; btnPause.classList.remove('ctrl-btn--active');
  currentIndex = -1; topBar.classList.remove('visible'); showCurrent();
});
document.getElementById('btnShare').addEventListener('click', () => {
  if (!isPaused) { isPaused = true; btnPause.textContent = 'Resume'; btnPause.classList.add('ctrl-btn--active'); clearTimeout(timeoutId); }
  var el = document.getElementById('currentEl');
  var phrase = el ? el.textContent.trim() : '';
  if (!phrase) return;
  var W = 1080, H = 1080;
  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');
  var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  bg.addColorStop(0, '#111114'); bg.addColorStop(1, '#08080a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  var orb = ctx.createRadialGradient(W*0.8, H*0.15, 0, W*0.8, H*0.15, 300);
  orb.addColorStop(0, 'rgba(212,160,160,0.06)'); orb.addColorStop(1, 'rgba(212,160,160,0)');
  ctx.fillStyle = orb; ctx.fillRect(0, 0, W, H);
  function wrapText(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else { line = test; }
    } if (line) lines.push(line); return lines;
  }
  document.fonts.ready.then(function() {
    var margin = 120, maxTextW = W - margin * 2;
    ctx.fillStyle = 'rgba(212,160,160,0.15)';
    ctx.font = 'italic 200px "Playfair Display", Georgia, serif';
    ctx.textAlign = 'left'; ctx.fillText('\u201C', margin - 30, H * 0.32);
    ctx.fillStyle = '#ede8df';
    var fontSize = phrase.length > 120 ? 36 : phrase.length > 60 ? 44 : 52;
    ctx.font = 'italic ' + fontSize + 'px "Source Serif 4", Georgia, serif';
    ctx.textAlign = 'center';
    var lines = wrapText(phrase, maxTextW);
    var lineH = fontSize * 1.6, totalH = lines.length * lineH;
    var startY = (H / 2) - (totalH / 2) + fontSize * 0.5;
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, startY + i * lineH);
    var lineY = startY + lines.length * lineH + 40;
    ctx.strokeStyle = 'rgba(212,160,160,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2 - 40, lineY); ctx.lineTo(W/2 + 40, lineY); ctx.stroke();
    ctx.fillStyle = 'rgba(212,160,160,0.5)';
    ctx.font = 'italic 28px "Playfair Display", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('from ' + story.title + ' by ' + story.author, W / 2, lineY + 50);
    ctx.fillStyle = 'rgba(237,232,223,0.1)';
    ctx.font = '400 32px "Playfair Display", Georgia, serif';
    ctx.fillText('linger', W / 2, H - 60);
    canvas.toBlob(function(blob) {
      var file = new File([blob], 'linger-' + story.title.toLowerCase().replace(/\s+/g,'-') + '.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'linger \u2014 ' + story.title }).catch(function() {});
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); URL.revokeObjectURL(a.href);
        var btn = document.getElementById('btnShare'); btn.textContent = 'Saved'; setTimeout(function() { btn.textContent = 'Share'; }, 1500);
      }
    }, 'image/png');
  });
});

let mouseTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-cursor');
  if (hasStarted) { controls.classList.add('visible'); themeToggle.classList.add('visible'); fsToggle.classList.add('visible'); }
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => { if (!isPaused) { controls.classList.remove('visible'); themeToggle.classList.remove('visible'); fsToggle.classList.remove('visible'); document.body.classList.remove('show-cursor'); } }, 2500);
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!hasStarted) beginExperience(); else btnPause.click(); }
  if (e.code === 'ArrowRight' && hasStarted && !isPaused) { clearTimeout(timeoutId); fadeAndAdvance(); }
  if (e.code === 'KeyR' && hasStarted) btnRestart.click();
  if (e.code === 'KeyF') fsToggle.click();
});
document.addEventListener('touchstart', () => {
  if (hasStarted) { controls.classList.add('visible'); themeToggle.classList.add('visible'); fsToggle.classList.add('visible'); }
  clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => { if (!isPaused) { controls.classList.remove('visible'); themeToggle.classList.remove('visible'); fsToggle.classList.remove('visible'); } }, 3000);
});
</script>
